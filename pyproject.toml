[project]
name = "qwen38-b70-bench"
version = "0.1.0"
description = "Minimal Intel XPU vLLM env for Qwen3.8-27B single-B70 benchmarking (lab nightly stack)"
readme = "AGENTS.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # --- PyTorch XPU wheel stack (from the pytorch-xpu index) ---
    "torch==2.13.0",
    "torchvision",
    "torchaudio",
    "torchcodec>=0.14",
    # Triton XPU: the nightly's `triton==3.7.2+xpu` shim pulls triton-xpu==3.7.2;
    # we depend on triton-xpu directly (provides the `triton` import) and exclude
    # the stock triton dist, mirroring uv_scaffolding_xpu.
    "triton-xpu==3.7.2",
    # vllm_xpu_kernels (PyPI, abi3 wheel) matching the nightly pin.
    "vllm-xpu-kernels==0.1.13.2",

    # --- built from source (see [tool.uv.sources] + no-build-isolation) ---
    "vllm",
]

[tool.uv]
index-strategy = "unsafe-best-match"
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

# xgrammar / openai-whisper declare a dep on stock `triton`, but on XPU the
# `triton` import must come from `triton-xpu` (mutually exclusive).
exclude-dependencies = ["triton"]

# vllm must build against the already-installed torch (+xpu), exactly like the
# official vLLM-Omni XPU Dockerfile / uv_scaffolding_xpu (no build isolation).
no-build-isolation-package = ["vllm"]

# Build tools required by the vllm source build, installed before it builds.
extra-build-dependencies = {
    vllm = [
        "cmake>=3.26.1",
        "ninja",
        "packaging>=24.2",
        "setuptools>=77.0.3,<81.0.0",
        "setuptools-scm>=8.0",
        "setuptools-rust>=1.9.0",
        "wheel",
        "jinja2",
        "grpcio-tools",
        "protobuf",
        "nanobind",
    ],
}

# Device selection for the XPU source build.
extra-build-variables = {
    vllm = {
        VLLM_TARGET_DEVICE = "xpu",
        VLLM_WORKER_MULTIPROC_METHOD = "spawn",
    },
}

# The cloned third-party tree must NOT be auto-discovered as a workspace member.
[tool.uv.workspace]
exclude = ["vendor/*"]

[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-xpu" }
torchvision = { index = "pytorch-xpu" }
torchaudio = { index = "pytorch-xpu" }
torchcodec = { index = "pytorch-xpu" }
triton-xpu = { index = "pytorch-xpu" }
vllm = { path = "vendor/vllm" }

# Static metadata for vllm: uv must not execute its setup.py to resolve the
# graph (setup.py imports torch at module level and derives its dependency list
# from the installed torch backend at build time). Mirrors vllm's
# requirements/{xpu,common}.txt at the pinned nightly commit e9d1398d9.
[[tool.uv.dependency-metadata]]
name = "vllm"
version = "0.26.1rc1.dev1102"
requires-dist = [
    "triton-xpu==3.7.2",
    "ray>=2.9",
    "cmake>=3.26.1",
    "packaging>=24.2",
